apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-internal
  namespace: observability
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-control-plane
  namespace: observability
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.1.151/32}
  egress:
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 192.168.1.151/32}
      ports:
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 9080}
        - {protocol: TCP, port: 9100}
        - {protocol: TCP, port: 10250}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-kube-system
  namespace: observability
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-exporter-scrape
  namespace: observability-agents
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus-node-exporter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports:
        - {protocol: TCP, port: 9100}
