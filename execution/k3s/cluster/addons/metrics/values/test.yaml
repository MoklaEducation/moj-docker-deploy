commonLabels:
  app.kubernetes.io/managed-by: mokla-cluster-addons

nodeExporter:
  enabled: false
windowsMonitoring:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 2m
    route:
      receiver: mokla-test-receiver
      group_by: [alertname, namespace]
      group_wait: 5s
      group_interval: 30s
      repeat_interval: 24h
    receivers:
      - name: "null"
      - name: mokla-test-receiver
        webhook_configs:
          - url: http://192.168.1.151:9080/alerts
            send_resolved: false
  alertmanagerSpec:
    image:
      sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    retention: 48h
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 200m, memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 1Gi}
    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: {type: RuntimeDefault}

grafana:
  enabled: true
  additionalDataSources:
    - name: Loki
      uid: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
      jsonData:
        maxLines: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile: {type: RuntimeDefault}
  testFramework:
    enabled: false
  image:
    sha: 69a5d2d957ca0bba434c160dcd4f2d07de9d6c756a0ba10ae7f52b72ced1e4cc
  env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    users:
      allow_sign_up: false
  initChownData:
    enabled: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
  sidecar:
    image:
      sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 100m, memory: 96Mi}

kube-state-metrics:
  image:
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 150m, memory: 128Mi}
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    readOnlyRootFilesystem: true

prometheusOperator:
  image:
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    readOnlyRootFilesystem: true
  admissionWebhooks:
    certManager:
      enabled: true
  prometheusConfigReloader:
    image:
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
    resources:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {cpu: 100m, memory: 96Mi}

prometheus:
  enabled: true
  prometheusSpec:
    image:
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 48h
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: 750m, memory: 1536Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 8Gi}
    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile: {type: RuntimeDefault}
