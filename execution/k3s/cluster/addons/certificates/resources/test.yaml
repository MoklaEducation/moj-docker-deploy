apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    app.kubernetes.io/managed-by: mokla-cluster-addons
    platform.mokla/environment: test
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mokla:cluster-addons:test-admin
  labels:
    app.kubernetes.io/managed-by: mokla-cluster-addons
    platform.mokla/security-exception: test-only-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: mokla:cluster-addons
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "12"
    secrets: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 32Mi}
      default: {cpu: 100m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.168.1.151/32}
  egress:
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 192.168.1.151/32}
      ports:
        - {protocol: TCP, port: 6443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-namespace-internal
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-certificate-smoke
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector:
    matchLabels: {platform.mokla/component: certificate-smoke}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mokla-test-bootstrap
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mokla-test-ca
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  isCA: true
  commonName: mokla-test-ca
  secretName: mokla-test-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: mokla-test-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: mokla-test-ca
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  ca:
    secretName: mokla-test-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: phase6-test-tls
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  secretName: phase6-test-tls
  dnsNames: [phase6.test.mokla.local]
  duration: 168h
  renewBefore: 24h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: mokla-test-ca
    kind: Issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: certificate-smoke
  namespace: cert-manager
  labels:
    app.kubernetes.io/managed-by: mokla-cluster-addons
    platform.mokla/component: certificate-smoke
spec:
  replicas: 1
  selector:
    matchLabels: {platform.mokla/component: certificate-smoke}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: mokla-cluster-addons
        platform.mokla/component: certificate-smoke
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
      containers:
        - name: http
          image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: [sh, -c, "mkdir -p /tmp/www && echo phase6-certificate-ok >/tmp/www/index.html && exec httpd -f -p 8080 -h /tmp/www"]
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: certificate-smoke
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  selector: {platform.mokla/component: certificate-smoke}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: certificate-smoke
  namespace: cert-manager
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [phase6.test.mokla.local]
      secretName: phase6-test-tls
  rules:
    - host: phase6.test.mokla.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: certificate-smoke
                port: {name: http}