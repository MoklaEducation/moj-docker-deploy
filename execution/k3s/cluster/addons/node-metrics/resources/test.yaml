apiVersion: v1
kind: Namespace
metadata:
  name: observability-agents
  labels:
    app.kubernetes.io/managed-by: mokla-cluster-addons
    platform.mokla/environment: test
    platform.mokla/security-exception: node-observability-host-access
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: observability-agents
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: observability-agents
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 64Mi}
      default: {cpu: 200m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: observability-agents
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
