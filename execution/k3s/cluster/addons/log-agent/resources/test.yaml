apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alloy-control-plane
  namespace: observability
  labels: {app.kubernetes.io/managed-by: mokla-cluster-addons}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alloy}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 192.168.1.151/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: loki}
      ports:
        - {protocol: TCP, port: 3100}
