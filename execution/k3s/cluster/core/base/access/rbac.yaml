apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mokla:platform-operator
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, services, endpoints, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mokla:cluster-core
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [platform-system, observability, backup-system, judge-test]
    verbs: [update, patch]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mokla:cluster-core-smoke
rules:
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mokla:cluster-observer
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mokla:platform-operator:observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mokla:cluster-observer
subjects:
  - kind: Group
    name: mokla:platform-operators
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mokla:cluster-core:observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mokla:cluster-observer
subjects:
  - kind: Group
    name: mokla:cluster-core
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:platform-operator
  namespace: platform-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:platform-operator"}
subjects:
  - {kind: Group, name: "mokla:platform-operators", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:platform-operator
  namespace: observability
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:platform-operator"}
subjects:
  - {kind: Group, name: "mokla:platform-operators", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:platform-operator
  namespace: backup-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:platform-operator"}
subjects:
  - {kind: Group, name: "mokla:platform-operators", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:cluster-core
  namespace: platform-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:cluster-core"}
subjects:
  - {kind: Group, name: "mokla:cluster-core", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:cluster-core
  namespace: observability
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:cluster-core"}
subjects:
  - {kind: Group, name: "mokla:cluster-core", apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mokla:cluster-core
  namespace: backup-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "mokla:cluster-core"}
subjects:
  - {kind: Group, name: "mokla:cluster-core", apiGroup: rbac.authorization.k8s.io}