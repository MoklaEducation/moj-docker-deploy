apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: judge-test
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: judge-test
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-host-data-services
  namespace: judge-test
spec:
  podSelector:
    matchLabels:
      platform.mokla/data-services-client: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.1.151/32
      ports:
        - {protocol: TCP, port: 3306}
        - {protocol: TCP, port: 6379}