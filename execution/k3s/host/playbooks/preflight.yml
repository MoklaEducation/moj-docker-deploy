---
- name: Inspect the candidate host without changing it
  hosts: platform_host
  become: true
  gather_facts: true
  vars_files:
    - "{{ platform_file }}"
  tasks:
    - name: Verify the supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == host.os_distribution
          - ansible_facts['distribution_version'] in host.os_versions
        fail_msg: "Expected {{ host.os_distribution }} {{ host.os_versions | join(' or ') }}, found {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."

    - name: Verify the supported architecture and init system
      ansible.builtin.assert:
        that:
          - ansible_facts['architecture'] in ['x86_64', 'amd64']
          - ansible_facts['service_mgr'] == 'systemd'
          - ansible_facts['python']['version']['major'] == 3
        fail_msg: "Host does not meet the supported architecture, init, or Python contract."

    - name: Verify configured host identity
      ansible.builtin.assert:
        that:
          - host_fqdn is defined
          - host_address is defined
        fail_msg: "platform.yml must define host_fqdn and host_address."

    - name: Verify CPU, memory, and root filesystem capacity
      ansible.builtin.assert:
        that:
          - ansible_facts['processor_nproc'] | int >= host.minimum_cpu | int
          - ansible_facts['memtotal_mb'] | int >= host.minimum_memory_mb | int
          - (ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | int) >= (host.minimum_root_free_gb | float * 1024 * 1024 * 1024)
        fail_msg: "Host resources are below the configured Phase 1 minimums."

    - name: Inspect the configured storage-root parent
      ansible.builtin.stat:
        path: "{{ host.storage_root | dirname }}"
        follow: false
      register: storage_parent

    - name: Verify storage-root parent safety without creating the root
      ansible.builtin.assert:
        that:
          - storage_parent.stat.exists
          - storage_parent.stat.isdir
          - not storage_parent.stat.islnk
        fail_msg: "The parent of {{ host.storage_root }} must exist, be a directory, and not be a symlink."

    - name: Check time synchronization state
      ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
      register: ntp_synchronized
      changed_when: false
      failed_when: false
      retries: 12
      delay: 5
      until: ntp_synchronized.stdout | trim == 'yes'

    - name: Verify time synchronization
      ansible.builtin.assert:
        that: ntp_synchronized.stdout | trim == 'yes'
        fail_msg: "The host does not report synchronized network time."

    - name: Inspect listening TCP sockets
      ansible.builtin.command: ss -H -ltn
      register: listening_sockets
      changed_when: false

    - name: Verify public ingress ports are available
      ansible.builtin.assert:
        that: "':' ~ (item | string) not in listening_sockets.stdout"
        fail_msg: "TCP port {{ item }} is already listening."
      loop: "{{ network.public_ingress_ports }}"

    - name: Collect service state
      ansible.builtin.service_facts:

    - name: Inspect project-managed k3s ownership files
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      loop:
        - {path: "{{ k3s.data_dir | dirname }}/.mokla-managed", mode: "0600"}
        - {path: /usr/local/bin/k3s, mode: "0755"}
        - {path: /etc/systemd/system/k3s.service, mode: "0644"}
      register: preflight_k3s_ownership

    - name: Determine whether running k3s is project-managed
      ansible.builtin.set_fact:
        preflight_k3s_is_managed: >-
          {{ preflight_k3s_ownership.results
             | selectattr('stat.exists')
             | selectattr('stat.isreg')
             | rejectattr('stat.islnk')
             | selectattr('stat.pw_name', 'equalto', 'root')
             | selectattr('stat.gr_name', 'equalto', 'root')
             | list
             | length == 3
             and preflight_k3s_ownership.results[0].stat.mode == '0600'
             and preflight_k3s_ownership.results[1].stat.mode == '0755'
             and preflight_k3s_ownership.results[2].stat.mode == '0644' }}

    - name: Verify conflicting Kubernetes services are absent
      ansible.builtin.assert:
        that: >-
          (item not in ansible_facts.services)
          or (ansible_facts.services[item].state != 'running')
          or (item == 'k3s.service' and preflight_k3s_is_managed)
        fail_msg: "Conflicting service {{ item }} is running."
      loop:
        - k3s.service
        - k3s-agent.service
        - kubelet.service
        - snap.microk8s.daemon-apiserver.service

    - name: Inspect Docker swarm state when Docker is available
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: docker_swarm_state
      changed_when: false
      failed_when: false

    - name: Verify Docker swarm is not active
      ansible.builtin.assert:
        that: docker_swarm_state.rc != 0 or docker_swarm_state.stdout | trim in ['inactive', '']
        fail_msg: "Docker Swarm is active and conflicts with the planned host ownership model."

    - name: Record immutable remote facts
      ansible.builtin.debug:
        msg:
          hostname: "{{ ansible_facts['hostname'] }}"
          fqdn: "{{ ansible_facts['fqdn'] }}"
          architecture: "{{ ansible_facts['architecture'] }}"
          processors: "{{ ansible_facts['processor_nproc'] }}"
          memory_mb: "{{ ansible_facts['memtotal_mb'] }}"
          filesystems: "{{ ansible_facts['mounts'] | map(attribute='mount') | list }}"