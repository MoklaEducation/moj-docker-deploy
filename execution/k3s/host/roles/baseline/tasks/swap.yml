---
- name: Disable active swap
  ansible.builtin.command: swapoff --all
  when:
    - host.disable_swap | bool
    - ansible_facts['swaptotal_mb'] | int > 0
    - not ansible_check_mode
  changed_when: true

- name: Disable persistent swap entries with a backup
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!\s*#)(\S+\s+\S+\s+swap\s+\S+.*)$'
    replace: '# mokla-disabled-swap \1'
    backup: true
    owner: root
    group: root
    mode: "0644"
  when: host.disable_swap | bool