---
- name: Persist required kernel modules
  ansible.builtin.copy:
    content: "overlay\nbr_netfilter\n"
    dest: /etc/modules-load.d/60-mokla-container.conf
    owner: root
    group: root
    mode: "0644"

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist and apply container networking sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/60-mokla-container.conf
    reload: true
  loop:
    - {name: net.ipv4.ip_forward, value: "1"}
    - {name: net.bridge.bridge-nf-call-iptables, value: "1"}
    - {name: net.bridge.bridge-nf-call-ip6tables, value: "1"}