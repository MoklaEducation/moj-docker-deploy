---
- name: Install explicit host baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - curl
      - gnupg
      - iproute2
      - jq
      - lsof
      - restic
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure periodic security updates
  ansible.builtin.template:
    src: apt-periodic.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Disable automatic reboot after unattended upgrades
  ansible.builtin.copy:
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
    dest: /etc/apt/apt.conf.d/52mokla-no-automatic-reboot
    owner: root
    group: root
    mode: "0644"

- name: Enable the unattended upgrades service when configured
  ansible.builtin.systemd_service:
    name: unattended-upgrades.service
    enabled: "{{ host.allow_automatic_security_updates }}"
    state: "{{ 'started' if host.allow_automatic_security_updates else 'stopped' }}"
  when: not ansible_check_mode