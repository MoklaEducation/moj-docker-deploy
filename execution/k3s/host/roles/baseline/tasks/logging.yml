---
- name: Create journald configuration directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure bounded persistent journald storage
  ansible.builtin.template:
    src: journald-baseline.conf.j2
    dest: /etc/systemd/journald.conf.d/60-mokla-baseline.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald