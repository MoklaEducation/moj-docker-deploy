---
- name: Require decrypted Phase 3 values only during apply
  ansible.builtin.assert:
    that:
      - mariadb_root_password is defined
      - redis_password is defined
      - not data_services.tls.enabled or lookup('ansible.builtin.vars', data_services.tls.server_certificate_secret_key) is string
      - not data_services.tls.enabled or lookup('ansible.builtin.vars', data_services.tls.server_private_key_secret_key) is string
      - not data_services.tls.enabled or lookup('ansible.builtin.vars', data_services.tls.ca_certificate_secret_key) is string
    fail_msg: Phase 3 apply requires validated controller-side decrypted secret values.
  when: not ansible_check_mode
  no_log: true

- name: Install normalized development service passwords
  ansible.builtin.copy:
    content: "{{ item.content | trim }}\n"
    dest: "{{ data_services_runtime_secret_root }}/{{ item.name }}"
    owner: "{{ data_services.redis.runtime_uid }}"
    group: "{{ data_services.redis.runtime_gid }}"
    mode: "0600"
  loop:
    - {name: mariadb-root-password, content: "{{ mariadb_root_password }}"}
    - {name: redis-password, content: "{{ redis_password }}"}
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services

- name: Install TLS material when enabled
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.vars', item.key) }}"
    dest: "{{ data_services_runtime_secret_root }}/{{ item.name }}"
    owner: "{{ data_services.redis.runtime_uid }}"
    group: "{{ data_services.redis.runtime_gid }}"
    mode: "0600"
  loop:
    - {name: server.crt, key: "{{ data_services.tls.server_certificate_secret_key }}"}
    - {name: server.key, key: "{{ data_services.tls.server_private_key_secret_key }}"}
    - {name: ca.crt, key: "{{ data_services.tls.ca_certificate_secret_key }}"}
  when:
    - not ansible_check_mode
    - data_services.tls.enabled
  no_log: true
  notify: Restart data services

- name: Install credential-safe MariaDB client configuration
  ansible.builtin.copy:
    content: |
      [client]
      user={{ data_services.mariadb.probe_username }}
      password={{ lookup('ansible.builtin.vars', data_services.mariadb.probe_password_secret_key) | trim | to_json }}
      host={{ data_services.bind_address }}
      port={{ data_services.mariadb.port }}
      {% if data_services.tls.enabled %}
      ssl-ca=/run/secrets/ca.crt
      {% else %}
      ssl=0
      {% endif %}
    dest: "{{ data_services_runtime_secret_root }}/mariadb-health.cnf"
    owner: "{{ data_services.mariadb.runtime_uid }}"
    group: "{{ data_services.mariadb.runtime_gid }}"
    mode: "0600"
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services

- name: Install hashed Redis ACL
  ansible.builtin.copy:
    content: "user default on #{{ redis_password | trim | hash('sha256') }} ~* &* +@all\n"
    dest: "{{ data_services_runtime_secret_root }}/redis-users.acl"
    owner: "{{ data_services.redis.runtime_uid }}"
    group: "{{ data_services.redis.runtime_gid }}"
    mode: "0600"
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services

- name: Require decrypted external platform service values during apply
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', external_platform_services.object_storage.root_user_secret_key) is string
      - lookup('ansible.builtin.vars', external_platform_services.object_storage.root_password_secret_key) is string
      - lookup('ansible.builtin.vars', external_platform_services.object_storage.restic_access_key_secret_key) is string
      - lookup('ansible.builtin.vars', external_platform_services.object_storage.restic_secret_key_secret_key) is string
    fail_msg: External platform service apply requires validated controller-side decrypted secret values.
  when: not ansible_check_mode
  no_log: true

- name: Install MinIO credential files
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.vars', item.key) | trim }}\n"
    dest: "{{ external_platform_services_secret_root }}/{{ item.name }}"
    owner: "{{ external_platform_services.object_storage.runtime_uid }}"
    group: "{{ external_platform_services.object_storage.runtime_gid }}"
    mode: "0400"
  loop:
    - {name: minio-root-user, key: "{{ external_platform_services.object_storage.root_user_secret_key }}"}
    - {name: minio-root-password, key: "{{ external_platform_services.object_storage.root_password_secret_key }}"}
    - {name: minio-restic-access-key, key: "{{ external_platform_services.object_storage.restic_access_key_secret_key }}"}
    - {name: minio-restic-secret-key, key: "{{ external_platform_services.object_storage.restic_secret_key_secret_key }}"}
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services