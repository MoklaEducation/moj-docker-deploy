---
- name: Require decrypted Phase 3 values only during apply
  ansible.builtin.assert:
    that:
      - mariadb_root_password is defined
      - redis_password is defined
      - lookup('ansible.builtin.vars', data_services.tls.server_certificate_secret_key) is string
      - lookup('ansible.builtin.vars', data_services.tls.server_private_key_secret_key) is string
      - lookup('ansible.builtin.vars', data_services.tls.ca_certificate_secret_key) is string
    fail_msg: Phase 3 apply requires validated controller-side decrypted secret values.
  when: not ansible_check_mode
  no_log: true

- name: Install root-only primitive secret files
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ data_services_runtime_secret_root }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - {name: mariadb-root-password, content: "{{ mariadb_root_password }}"}
    - {name: redis-password, content: "{{ redis_password }}"}
    - {name: server.crt, content: "{{ lookup('ansible.builtin.vars', data_services.tls.server_certificate_secret_key) }}"}
    - {name: server.key, content: "{{ lookup('ansible.builtin.vars', data_services.tls.server_private_key_secret_key) }}"}
    - {name: ca.crt, content: "{{ lookup('ansible.builtin.vars', data_services.tls.ca_certificate_secret_key) }}"}
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services

- name: Install credential-safe MariaDB client configuration
  ansible.builtin.copy:
    content: |
      [client]
      user=root
      password={{ mariadb_root_password | to_json }}
      host={{ data_services.bind_address }}
      port={{ data_services.mariadb.port }}
      ssl-ca=/run/secrets/ca.crt
      ssl-cert=/run/secrets/server.crt
      ssl-key=/run/secrets/server.key
    dest: "{{ data_services_runtime_secret_root }}/mariadb-health.cnf"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services

- name: Install hashed Redis ACL
  ansible.builtin.copy:
    content: "user default on #{{ redis_password | hash('sha256') }} ~* &* +@all\n"
    dest: "{{ data_services_runtime_secret_root }}/redis-users.acl"
    owner: root
    group: root
    mode: "0600"
  when: not ansible_check_mode
  no_log: true
  notify: Restart data services