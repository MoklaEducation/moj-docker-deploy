---
- name: Allow MariaDB and Redis only from reviewed client networks
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item.0 }}"
    to_ip: "{{ data_services.bind_address }}"
    to_port: "{{ item.1 }}"
    comment: mokla private data service
  loop: "{{ data_services.allowed_client_cidrs | product([data_services.mariadb.port, data_services.redis.port]) | list }}"
  when: not ansible_check_mode

- name: Allow external platform service APIs only from reviewed client networks
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item.0 }}"
    to_ip: "{{ external_platform_services.bind_address }}"
    to_port: "{{ item.1 }}"
    comment: mokla external platform service
  loop: "{{ external_platform_services.allowed_client_cidrs | product([external_platform_services.object_storage.api_port, external_platform_services.alert_receiver.port]) | list }}"
  when: not ansible_check_mode

- name: Allow MinIO console only from administrative networks
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item }}"
    to_ip: "{{ external_platform_services.bind_address }}"
    to_port: "{{ external_platform_services.object_storage.console_port }}"
    comment: mokla private MinIO console
  loop: "{{ network.administrative_cidrs }}"
  when: not ansible_check_mode