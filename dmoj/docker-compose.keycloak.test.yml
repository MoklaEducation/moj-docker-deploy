services:
  keycloak-db:
    image: mariadb:11.4.5
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      MYSQL_USER: ${KEYCLOAK_DB_USER:-keycloak}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-change-me-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - keycloak-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - keycloak
    mem_limit: 512m
    cpus: 0.5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start-dev
      - --hostname=auth.test.local
      - --hostname-strict=false
      - --proxy-headers=xforwarded
      - --proxy-trusted-addresses=0.0.0.0/0,::/0
      - --http-port=8080
      - --http-enabled=true
      - --db=mariadb
      - --db-url=jdbc:mariadb://keycloak-db:3306/keycloak?characterEncoding=UTF-8
      - --db-username=${KEYCLOAK_DB_USER:-keycloak}
      - --db-password=${KEYCLOAK_DB_PASSWORD:-change-me}
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: auth.test.local
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: "0.0.0.0/0,::/0"
    networks:
      - keycloak
      - nginx
    expose:
      - "8080"
    volumes:
      - ./keycloak/test/realm-dmoj-test.json:/opt/keycloak/data/import/realm-dmoj-test.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    mem_limit: 768m
    cpus: 1.0

  nginx:
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      keycloak:
      nginx:
        aliases:
          - auth.test.local
          - code.test.local
      site:

networks:
  keycloak:
    driver: bridge
  nginx:
    external: false

volumes:
  keycloak-db-data:
