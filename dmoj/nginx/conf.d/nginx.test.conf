## Test-only Nginx config used by docker-compose.test.yml.
## Purpose:
## - Provide TLS for portability testing without using production cert paths.
## - Preserve upstream routing behavior close to production.
## Expected mounted cert files:
## - /etc/nginx/test-certs/code.test.local.crt
## - /etc/nginx/test-certs/code.test.local.key
server {
    listen 80;
    server_name _;

    # Keep HTTP endpoint simple in test: redirect all traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/test-certs/code.test.local.crt;
    ssl_certificate_key /etc/nginx/test-certs/code.test.local.key;

    client_max_body_size 48M;

    add_header X-UA-Compatible "IE=Edge,chrome=1";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;
    # Try static file path first, then fallback to icon/uWSGI flow.
    try_files $uri @icons;
    error_page 502 504 /502.html;

    location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
        root /assets/;
    }

    location @icons {
        root /assets/resources/icons/;
        log_not_found off;
        error_page 403 = @uwsgi;
        error_page 404 = @uwsgi;
    }

    location @uwsgi {
        # Main DMOJ app upstream (uWSGI in site container).
        uwsgi_read_timeout 600;
        uwsgi_pass site:8000;
        include uwsgi_params;
        uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
    }

    location /static {
        gzip_static on;
        expires max;
        root /assets/;
    }

    location /media {
        alias /media/;
    }

    location /pdfcache {
        internal;
        root /;
    }

    location /datacache {
        internal;
        root /;
    }

    location /mathoid {
        default_type image/svg+xml;
        alias /cache/mathoid;
    }

    location /texoid {
        default_type image/svg+xml;
        alias /cache/texoid;
    }

    location /event/ {
        # WebSocket event stream.
        proxy_pass http://wsevent:15100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /channels/ {
        # Additional event channels endpoint.
        proxy_read_timeout 120;
        proxy_pass http://wsevent:15102/;
    }
}
